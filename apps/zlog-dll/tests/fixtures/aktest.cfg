sendnr        $Q
exit ;
script lua
local bands = {}
for i = 2, 12 do
	bands[zlog.bands[i]] = true
end
local modes = {CW = true, SSB = true, FM = true, AM = true}

function init()
	return {}
end

function add(state, qso)
	if qso.dupe then
		return state, {invalid = "dupe"}
	end
	if not bands[qso.band] then
		return state, {invalid = "band"}
	end
	if not modes[qso.mode] then
		return state, {invalid = "mode"}
	end
	local mul, mem = string.match(qso.rcvd, "^(%d*)(.*)$")
	if #mul < 4 or (mem ~= "" and mem ~= "M") then
		return state, {invalid = "rcvd"}
	end
	local score = 3
	if mem == "M" or mul == "0102" then
		score = 9
	elseif string.sub(mul, 1, 2) == "01" then
		score = 6
	end
	return state, {score = score, mul1 = mul}
end

function total(state, sums)
	return sums.score * sums.mults
end
