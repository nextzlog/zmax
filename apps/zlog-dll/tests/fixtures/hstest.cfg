script lua
local bands = {["7"] = true, ["21"] = true, ["50"] = true, ["144"] = true, ["430"] = true}
local modes = {CW = true, SSB = true, FM = true, AM = true}

function init()
	return {hs = {}}
end

local function judge(qso)
	if qso.dupe then
		return {invalid = "dupe"}
	end
	if not bands[qso.band] then
		return {invalid = "band"}
	end
	if not modes[qso.mode] then
		return {invalid = "mode"}
	end
	local digits, tail = string.match(qso.rcvd, "^(%d*)(.*)$")
	if #digits < 2 or (tail ~= "HS" and tail ~= "C") then
		return {invalid = "rcvd"}
	end
	return {
		score = if qso.mode == "CW" then 3 else 1,
		mul1 = digits,
		mul2 = if tail == "HS" then "HS" else "",
	}
end

function add(state, qso)
	local verdict = judge(qso)
	if verdict.mul2 == "HS" then
		local key = qso.band .. " " .. qso.call
		if state.hs[key] then
			verdict.mul2 = ""
		else
			state.hs[key] = true
		end
	end
	return state, verdict
end

function total(state, sums)
	return sums.score * sums.mults
end
