f1_a          CQ HS TEST DE $M $M TEST
f2_a          $C $R$VC
f3_a          TU $M TEST
f4_a          NR?
f5_a          $C?
f6_a          QRZ?
f7_a          $C TU DE $M TEST
f8_a          $C QSO B4 TU
